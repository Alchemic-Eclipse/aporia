
name: Build Aporia for Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install raylib (static)
        shell: pwsh
        run: |
          vcpkg install raylib:x64-windows-static

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build Aporia
        run: cmake --build build --config Release

      - name: Check runtime dependencies
        shell: pwsh
        run: |
          $exe = Resolve-Path "build/Release/aporia.exe"
          dumpbin /DEPENDENTS $exe

      - name: Package Aporia
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "build/Release/aporia.exe" "dist/aporia.exe"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: aporia-windows-x64
          path: dist/aporia.exe
          if-no-files-found: error
