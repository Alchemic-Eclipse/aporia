
name: Build Aporia for Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install raylib
        run: vcpkg install raylib:x64-windows

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build Aporia
        run: cmake --build build --config Release

      - name: Package Aporia
        shell: pwsh
        run: |
          $out = "dist"
          New-Item -ItemType Directory -Force $out | Out-Null

          Copy-Item "build/Release/aporia.exe" $out

          $dllDir = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin"

          if (!(Test-Path "$dllDir/raylib.dll")) {
            throw "raylib.dll was not found in $dllDir"
          }

          Get-ChildItem $dllDir -Filter "*.dll" |
            Copy-Item -Destination $out -Force

          Get-ChildItem $out

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: aporia-windows-x64
          path: dist/
          if-no-files-found: error
