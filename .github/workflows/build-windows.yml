
name: Build Aporia for Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install raylib and GLFW
        shell: pwsh
        run: |
          vcpkg install raylib:x64-windows-static glfw3:x64-windows-static

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build Aporia
        run: cmake --build build --config Release

      - name: Check runtime dependencies
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem `
            "C:\Program Files\Microsoft Visual Studio" `
            -Filter dumpbin.exe `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\Hostx64\\x64\\dumpbin\.exe$' } |
            Select-Object -First 1

          if ($dumpbin) {
            & $dumpbin.FullName /DEPENDENTS "build/Release/aporia.exe"
          } else {
            Write-Host "dumpbin unavailable; skipping optional dependency inspection."
          }

      - name: Package Aporia
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/aporia.exe dist/aporia.exe
          Get-ChildItem dist

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: aporia-windows-x64
          path: dist/aporia.exe
          if-no-files-found: error
